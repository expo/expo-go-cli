name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Test end-to-end
        run: bun run test:e2e

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version }}
        run: |
          npm version "$VERSION_BUMP" --no-git-tag-version
          version="$(node --print "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push version branch
        id: release-commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v${VERSION}"
          git switch --create "$branch"
          git add package.json
          git commit \
            -m "Bump to version ${VERSION}" \
            -m "Co-authored-by: Krystof Woldrich <31292499+krystofwoldrich@users.noreply.github.com>
          Co-authored-by: OpenAI Codex <codex@openai.com>"
          git push --set-upstream origin "$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open version pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh pr create \
            --base main \
            --head "release/v${VERSION}" \
            --title "Bump to version ${VERSION}" \
            --body "Automated version bump created by the Release workflow for the published expo-go@${VERSION} release."

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "expo-go@${VERSION}" version >/dev/null 2>&1; then
            echo "expo-go@${VERSION} is already published; skipping npm publish."
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="expo-go@${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; skipping GitHub release creation."
          else
            gh release create "$tag" \
              --target "$RELEASE_SHA" \
              --title "$tag" \
              --generate-notes
          fi
